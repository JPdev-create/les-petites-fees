# E-mails, synchronisation Airbnb/Booking et relances — toutes les 3 heures (quota Firebase gratuit).
# Pointeuse LPF : une fois par jour, au premier passage après 19 h. « Run workflow » lance tout tout de suite.
name: Automatisations

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      sync:
        description: "(Lancé à la main, tout est toujours fait tout de suite)"
        type: boolean
        default: true

concurrency:
  group: automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Exécuter les automatisations
        env:
          TZ: Europe/Brussels
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          POINTEUSE_SERVICE_ACCOUNT: ${{ secrets.POINTEUSE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
        # Lancement à la main (« Run workflow ») : tout est fait tout de suite, y compris l'envoi à la pointeuse
        run: npx tsx scripts/automation.ts ${{ github.event_name == 'workflow_dispatch' && '--sync' || '' }}
